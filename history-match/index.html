<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e5">
<title>れきしマッチ｜出来事と人物を結びつけよう</title>
<script src="../people.js"></script>
<script src="../history-order/dates.js"></script>
<style>
:root{--paper:#f7f1e5;--ink:#302b25;--muted:#746b5d;--red:#8c3b2f;--green:#426b58;--line:#d8c9aa;--card:#fffdf7;--gold:#b18b39}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px max(16px,calc((100vw - 1100px)/2));background:#fbf7ee;border-bottom:1px solid var(--line)}header a{color:var(--red);font-weight:800;text-decoration:none}header strong{font-size:1rem}header span{margin-left:auto;color:var(--muted);font-size:.85rem}
main{width:min(1320px,calc(100% - 36px));margin:0 auto;padding:24px 0 40px}h1{font-size:clamp(1.8rem,5vw,2.6rem);color:var(--red);margin:6px 0 8px}.intro{color:var(--muted);line-height:1.8;margin:0 0 20px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#eee3cc;border-radius:999px;padding:8px 13px;font-weight:800}.btn{border:0;border-radius:10px;padding:12px 16px;min-height:46px;font:inherit;font-weight:850;cursor:pointer}.primary{background:var(--red);color:white}.soft{background:#eee3cc;color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:20px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 16px #59472b0b}.panel h2{font-size:1.2rem;margin:0 0 14px}.events{display:flex;flex-direction:column;gap:10px}.event{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:white;padding:12px}.year{display:flex;align-items:center;justify-content:center;background:#f1e5ce;border-radius:9px;color:var(--red);font-weight:900;text-align:center;padding:10px;font-size:1rem}.event-main{min-width:0}.event-title{font-weight:850;line-height:1.6;font-size:1.02rem}.event-hint{font-size:.82rem;color:var(--muted);margin-top:4px}.slot{margin-top:10px;min-height:52px;border:2px dashed #c8b995;border-radius:9px;display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--muted);font-size:.9rem}.slot.selected{border-color:var(--gold);background:#fbf2dc;color:var(--ink)}.slot.filled{border-style:solid;border-color:#9cbca5;background:#e7f1e7;color:#28583f;font-weight:850}.slot.wrong{border-color:#d8a18d;background:#fff0e8;color:#873e2d}.slot img{width:32px;height:32px;object-fit:cover;border-radius:7px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.person{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;min-height:92px;font:inherit;cursor:pointer;color:var(--ink)}.person img{width:60px;height:60px;object-fit:cover;border-radius:9px;background:#eee4cf;flex-shrink:0}.person-name{font-weight:850;line-height:1.45;font-size:1rem}.person-era{font-size:.74rem;color:var(--muted);margin-top:3px}.person:disabled{opacity:.42;cursor:default}.person.active{border:2px solid var(--gold);background:#fbf2dc}.feedback{display:none;margin-top:14px;border-radius:10px;padding:12px;line-height:1.7;font-weight:750}.feedback.show{display:block}.feedback.ok{background:#e4f0e6;color:#28583f}.feedback.ng{background:#fff0e8;color:#873e2d}.empty{color:var(--muted);font-size:.9rem}.note{color:var(--muted);font-size:.82rem;line-height:1.6;margin-top:12px}
@media(min-width:761px) and (max-width:1050px){.layout{grid-template-columns:minmax(0,1fr) minmax(320px,.95fr)}.people{gap:9px}.person{padding:9px;min-height:82px}.person img{width:52px;height:52px}}\n@media(max-width:760px){main{width:calc(100% - 24px);padding-top:16px}.layout{grid-template-columns:1fr;gap:12px}.people{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.panel{padding:12px}.event{grid-template-columns:66px minmax(0,1fr);gap:8px;padding:8px}.person{min-height:76px;padding:8px;gap:8px}.person img{width:44px;height:44px}.person-name{font-size:.92rem}}\n@media(max-width:390px){.people{grid-template-columns:1fr}.toolbar{gap:7px}.pill{font-size:.85rem;padding:7px 10px}.event{grid-template-columns:58px minmax(0,1fr)}.year{font-size:.85rem}}
</style>
</head>
<body>
<header><a href="../">← 歴史探偵団</a><strong>れきしマッチ</strong><span>出来事 × 人物</span></header>
<main>
<div style="font-size:.75rem;letter-spacing:.12em;color:var(--green);font-weight:900">HISTORY MATCH</div>
<h1>れきしマッチ</h1>
<p class="intro">年表の出来事を読み、関係する人物カードを選んで結びつけよう。出来事は古い順に並んでいるよ。人物を選ぶだけで操作できるので、タブレットでも遊べます。</p>
<div class="toolbar"><span class="pill" id="progress">0 / 5 問</span><span class="pill" id="score">正解 0</span><button class="btn soft" id="restart">別の問題にする</button></div>
<div class="layout">
<section class="panel"><h2>① 年表の出来事</h2><div class="events" id="events"></div><div class="feedback" id="feedback" aria-live="polite"></div><p class="note">まず出来事の「人物を選ぶ」を押してから、右の人物カードを選ぼう。</p><button class="btn primary" id="next" style="display:none;width:100%;margin-top:12px">次の問題へ</button></section>
<section class="panel"><h2>② 人物カード</h2><div class="people" id="people"></div><p class="note">人物の名前とイラストを手がかりに考えよう。正解した人物カードは選べなくなります。</p></section>
</div>
</main>
<script>
(function(){
const people = PEOPLE.filter(p => HISTORY_DATES[p.id] && p.icon);
const allEvents = people.map(p => ({person:p, ...HISTORY_DATES[p.id]})).sort((a,b)=>a.year-b.year);
let round=[], selectedEvent=null, usedPeople=new Set(), score=0, solved=0, answered=false;
const $=id=>document.getElementById(id);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function newRound(){
 const pool=shuffle(allEvents);
 round=pool.slice(0,Math.min(5,pool.length)).sort((a,b)=>a.year-b.year);
 selectedEvent=null;usedPeople=new Set();score=0;solved=0;answered=false;
 $('feedback').className='feedback';$('feedback').textContent='';$('next').style.display='none';
 renderEvents();renderPeople();updateProgress();
}
function renderEvents(){
 $('events').innerHTML=round.map((e,i)=>'<article class="event"><div class="year">'+e.date+'</div><div class="event-main"><div class="event-title">'+e.event+'</div><div class="event-hint">年表 '+(i+1)+'</div><button class="slot" data-event="'+e.person.id+'" '+(usedPeople.has(e.person.id)?'disabled':'')+'>'+(usedPeople.has(e.person.id)?'<span>✓</span> 正解！ '+e.person.name:'人物を選ぶ ＋')+'</button></div></article>').join('');
 $('events').querySelectorAll('.slot').forEach(b=>{b.classList.toggle('filled',usedPeople.has(b.dataset.event));b.classList.toggle('selected',selectedEvent===b.dataset.event);b.addEventListener('click',()=>{if(answered||usedPeople.has(b.dataset.event))return;selectedEvent=b.dataset.event;renderEvents();renderPeople();$('feedback').className='feedback';$('feedback').textContent='人物カードから、出来事に関係する人を選ぼう。'})});
}
function renderPeople(){
 const options=shuffle([...new Set(round.map(e=>e.person))]);
 $('people').innerHTML=options.map(p=>'<button class="person '+(selectedEvent===p.id?'active':'')+'" data-person="'+p.id+'" '+(usedPeople.has(p.id)||answered?'disabled':'')+'><img src="../assets/people/'+p.icon+'.png" alt=""><span><span class="person-name">'+p.name+'</span><span class="person-era">'+p.era+'</span></span></button>').join('');
 $('people').querySelectorAll('.person').forEach(b=>b.addEventListener('click',()=>choosePerson(b.dataset.person)));
}
function choosePerson(id){
 if(answered||!selectedEvent){$('feedback').className='feedback show ng';$('feedback').textContent='先に年表の出来事の「人物を選ぶ」を押してね。';return}
 const event=round.find(e=>e.person.id===selectedEvent), picked=people.find(p=>p.id===id);
 if(id===selectedEvent){
  usedPeople.add(id);score++;solved++;selectedEvent=null;
  $('feedback').className='feedback show ok';$('feedback').textContent='正解！ '+picked.name+' と「'+event.event+'」が結びついたね。';
 }else{
  $('feedback').className='feedback show ng';$('feedback').textContent='もう一度考えてみよう。ヒント：'+picked.hint+'。';
 }
 renderEvents();renderPeople();updateProgress();
 if(solved===round.length){answered=true;$('feedback').className='feedback show ok';$('feedback').textContent='全問クリア！ 出来事と人物のつながりを確認できたね。';$('next').style.display='block';renderPeople()}
}
function updateProgress(){$('progress').textContent=solved+' / '+round.length+' 問';$('score').textContent='正解 '+score}
$('restart').addEventListener('click',newRound);$('next').addEventListener('click',newRound);newRound();
})();
</script>
</body>
</html>

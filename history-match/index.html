<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e5">
<title>れきしマッチ｜出来事と人物を結びつけよう</title>
<script src="../people.js"></script>
<script src="../history-order/dates.js"></script>
<style>
:root{--paper:#f7f1e5;--ink:#302b25;--muted:#746b5d;--red:#8c3b2f;--green:#426b58;--line:#d8c9aa;--card:#fffdf7;--gold:#b18b39}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px max(16px,calc((100vw - 1100px)/2));background:#fbf7ee;border-bottom:1px solid var(--line)}header a{color:var(--red);font-weight:800;text-decoration:none}header strong{font-size:1rem}header span{margin-left:auto;color:var(--muted);font-size:.85rem}
main{width:min(1320px,calc(100% - 36px));margin:0 auto;padding:24px 0 40px}h1{font-size:clamp(1.8rem,5vw,2.6rem);color:var(--red);margin:6px 0 8px}.intro{color:var(--muted);line-height:1.8;margin:0 0 20px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#eee3cc;border-radius:999px;padding:8px 13px;font-weight:800}.btn{border:0;border-radius:10px;padding:12px 16px;min-height:46px;font:inherit;font-weight:850;cursor:pointer}.primary{background:var(--red);color:white}.soft{background:#eee3cc;color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:20px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 16px #59472b0b}.panel h2{font-size:1.2rem;margin:0 0 14px}.events{display:flex;flex-direction:column;gap:10px}.event{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:white;padding:12px}.year{display:flex;align-items:center;justify-content:center;background:#f1e5ce;border-radius:9px;color:var(--red);font-weight:900;text-align:center;padding:10px;font-size:1rem}.event-main{min-width:0}.event-title{font-weight:850;line-height:1.6;font-size:1.02rem}.event-hint{font-size:.82rem;color:var(--muted);margin-top:4px}.slot{margin-top:10px;min-height:52px;border:2px dashed #c8b995;border-radius:9px;display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--muted);font-size:.9rem}.slot.selected{border-color:var(--gold);background:#fbf2dc;color:var(--ink)}.slot.drop-target{border-style:solid;border-color:var(--gold);background:#fff5cf;box-shadow:0 0 0 3px #b18b3926}.event.drag-over{border-color:var(--gold);background:#fff9e9}.slot.filled{border-style:solid;border-color:#9cbca5;background:#e7f1e7;color:#28583f;font-weight:850}.slot.wrong{border-color:#d8a18d;background:#fff0e8;color:#873e2d}.slot img{width:32px;height:32px;object-fit:cover;border-radius:7px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.person{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;min-height:92px;font:inherit;cursor:pointer;color:var(--ink)}.person img{width:60px;height:60px;object-fit:cover;border-radius:9px;background:#eee4cf;flex-shrink:0}.person-name{font-weight:850;line-height:1.45;font-size:1rem}.person-era{font-size:.74rem;color:var(--muted);margin-top:3px}.person:disabled{opacity:.42;cursor:default}.person.active{border:2px solid var(--gold);background:#fbf2dc}.person.dragging{opacity:.28}.drag-grip{display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:center;width:30px;height:40px;border-radius:8px;background:#f1e5ce;color:var(--red);font-size:1.2rem;font-weight:900;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.drag-grip:active{cursor:grabbing}.drag-ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;opacity:.96;box-shadow:0 12px 30px #302b2533;transform:translate(-50%,-50%);border:2px solid var(--gold);background:#fffdf7;touch-action:none}.drag-ghost .drag-grip{display:none}.feedback{display:none;margin-top:14px;border-radius:10px;padding:12px;line-height:1.7;font-weight:750}.feedback.show{display:block}.feedback.ok{background:#e4f0e6;color:#28583f}.feedback.ng{background:#fff0e8;color:#873e2d}.empty{color:var(--muted);font-size:.9rem}.note{color:var(--muted);font-size:.82rem;line-height:1.6;margin-top:12px}
@media(min-width:761px) and (max-width:1050px){.layout{grid-template-columns:minmax(0,1fr) minmax(320px,.95fr)}.people{gap:9px}.person{padding:9px;min-height:82px}.person img{width:52px;height:52px}}
@media(max-width:760px){main{width:calc(100% - 24px);padding-top:16px}.layout{grid-template-columns:1fr;gap:12px}.people{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.panel{padding:12px}.event{grid-template-columns:66px minmax(0,1fr);gap:8px;padding:8px}.person{min-height:76px;padding:8px;gap:8px}.person img{width:44px;height:44px}.person-name{font-size:.92rem}}
@media(max-width:390px){.people{grid-template-columns:1fr}.toolbar{gap:7px}.pill{font-size:.85rem;padding:7px 10px}.event{grid-template-columns:58px minmax(0,1fr)}.year{font-size:.85rem}}
</style>
</head>
<body>
<header><a href="../">← 歴史探偵団</a><strong>れきしマッチ</strong><span>出来事 × 人物</span></header>
<main>
<div style="font-size:.75rem;letter-spacing:.12em;color:var(--green);font-weight:900">HISTORY MATCH</div>
<h1>れきしマッチ</h1>
<p class="intro">年表の出来事に、関係する人物カードを結びつけよう。人物カード右端の「⠿」をつかんで、出来事の枠までドラッグしてね。カードをタップして選ぶ方法でも遊べます。</p>
<div class="toolbar"><span class="pill" id="progress">0 / 5 問</span><span class="pill" id="score">正解 0</span><button class="btn soft" id="restart">別の問題にする</button></div>
<div class="layout">
<section class="panel"><h2>① 年表の出来事</h2><div class="events" id="events"></div><div class="feedback" id="feedback" aria-live="polite"></div><p class="note">人物カード右端の「⠿」をつかみ、出来事の枠まで動かしてはなそう。タップで選んでから枠を選ぶ方法も使えます。</p><button class="btn primary" id="next" style="display:none;width:100%;margin-top:12px">次の問題へ</button></section>
<section class="panel"><h2>② 人物カード</h2><div class="people" id="people"></div><p class="note">名前やイラストを手がかりにしよう。⠿をつかむとドラッグできます。正解した人物カードは選べなくなります。</p></section>
</div>
</main>
<script>
(function(){
const people = PEOPLE.filter(p => HISTORY_DATES[p.id] && p.icon);
const allEvents = people.map(p => ({person:p, ...HISTORY_DATES[p.id]})).sort((a,b)=>a.year-b.year);
let round=[], personOptions=[], selectedEvent=null, usedPeople=new Set(), score=0, solved=0, answered=false;
let activeDrag=null, suppressClickUntil=0, activeDropSlot=null;
const $=id=>document.getElementById(id);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function newRound(){
 const pool=shuffle(allEvents);
 round=pool.slice(0,Math.min(5,pool.length)).sort((a,b)=>a.year-b.year);
 personOptions=shuffle([...new Set(round.map(e=>e.person))]);
 selectedEvent=null;usedPeople=new Set();score=0;solved=0;answered=false;
 $('feedback').className='feedback';$('feedback').textContent='';$('next').style.display='none';
 renderEvents();renderPeople();updateProgress();
}
function renderEvents(){
 $('events').innerHTML=round.map((e,i)=>'<article class="event"><div class="year">'+e.date+'</div><div class="event-main"><div class="event-title">'+e.event+'</div><div class="event-hint">年表 '+(i+1)+'</div><button class="slot" data-event="'+e.person.id+'" '+(usedPeople.has(e.person.id)?'disabled':'')+'>'+(usedPeople.has(e.person.id)?'<span>✓</span> 正解！ '+e.person.name:'人物を選ぶ ＋')+'</button></div></article>').join('');
 $('events').querySelectorAll('.slot').forEach(b=>{b.classList.toggle('filled',usedPeople.has(b.dataset.event));b.classList.toggle('selected',selectedEvent===b.dataset.event);b.addEventListener('click',()=>{if(answered||usedPeople.has(b.dataset.event))return;selectedEvent=b.dataset.event;renderEvents();renderPeople();$('feedback').className='feedback';$('feedback').textContent='人物カードから、出来事に関係する人を選ぼう。'})});
}
function renderPeople(){
 $('people').innerHTML=personOptions.map(p=>'<button class="person '+(selectedEvent===p.id?'active':'')+'" data-person="'+p.id+'" '+(usedPeople.has(p.id)||answered?'disabled':'')+'><img src="../assets/people/'+p.icon+'.png" alt=""><span><span class="person-name">'+p.name+'</span><span class="person-era">'+p.era+'</span></span><span class="drag-grip" data-drag-handle="'+p.id+'" aria-label="'+p.name+'をドラッグ" title="つかんでドラッグ">⠿</span></button>').join('');
 $('people').querySelectorAll('.person').forEach(b=>{
  b.addEventListener('click',()=>{if(Date.now()<suppressClickUntil)return;choosePerson(b.dataset.person)});
  const handle=b.querySelector('[data-drag-handle]');
  handle.addEventListener('pointerdown',e=>startDrag(e,b,handle));
  handle.addEventListener('click',e=>{e.stopPropagation();if(Date.now()>=suppressClickUntil)choosePerson(b.dataset.person)});
 });
}
function choosePerson(id){
 if(answered||!selectedEvent){$('feedback').className='feedback show ng';$('feedback').textContent='先に年表の出来事を選ぶか、人物カードを出来事の枠までドラッグしてね。';return}
 matchPersonToEvent(selectedEvent,id);
}
function matchPersonToEvent(eventId,id){
 if(answered||usedPeople.has(id))return;
 const event=round.find(e=>e.person.id===eventId), picked=people.find(p=>p.id===id);
 if(!event||!picked)return;
 selectedEvent=eventId;
 if(id===eventId){
  usedPeople.add(id);score++;solved++;selectedEvent=null;
  $('feedback').className='feedback show ok';$('feedback').textContent='正解！ '+picked.name+' と「'+event.event+'」が結びついたね。';
 }else{
  $('feedback').className='feedback show ng';$('feedback').textContent='もう一度考えてみよう。ヒント：'+picked.hint+'。';
 }
 renderEvents();renderPeople();updateProgress();
 if(solved===round.length){answered=true;$('feedback').className='feedback show ok';$('feedback').textContent='全問クリア！ 出来事と人物のつながりを確認できたね。';$('next').style.display='block';renderPeople()}
}
function startDrag(event,card,handle){
 if(answered||card.disabled)return;
 event.preventDefault();event.stopPropagation();
 activeDrag={id:card.dataset.person,startX:event.clientX,startY:event.clientY,pointerId:event.pointerId,card,dragging:false,ghost:null};
 document.addEventListener('pointermove',moveDrag,{passive:false});
 document.addEventListener('pointerup',endDrag);
 document.addEventListener('pointercancel',cancelDrag);
}
function moveDrag(event){
 if(!activeDrag||event.pointerId!==activeDrag.pointerId)return;
 const dx=event.clientX-activeDrag.startX,dy=event.clientY-activeDrag.startY;
 if(!activeDrag.dragging&&Math.hypot(dx,dy)>7){
  activeDrag.dragging=true;
  activeDrag.card.classList.add('dragging');
  const ghost=activeDrag.card.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.width=activeDrag.card.getBoundingClientRect().width+'px';ghost.style.height=activeDrag.card.getBoundingClientRect().height+'px';document.body.appendChild(ghost);activeDrag.ghost=ghost;
 }
 if(!activeDrag.dragging)return;
 event.preventDefault();
 activeDrag.ghost.style.left=event.clientX+'px';activeDrag.ghost.style.top=event.clientY+'px';
 const under=document.elementFromPoint(event.clientX,event.clientY);
 const slot=under?under.closest('.slot'):null;
 if(activeDropSlot!==slot){
  if(activeDropSlot){activeDropSlot.classList.remove('drop-target');activeDropSlot.closest('.event')?.classList.remove('drag-over')}
  activeDropSlot=slot&&!slot.disabled?slot:null;
  if(activeDropSlot){activeDropSlot.classList.add('drop-target');activeDropSlot.closest('.event')?.classList.add('drag-over')}
 }
}
function endDrag(event){
 if(!activeDrag||event.pointerId!==activeDrag.pointerId)return;
 const drag=activeDrag;document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointercancel',cancelDrag);
 const under=document.elementFromPoint(event.clientX,event.clientY);
 const found=under?under.closest('.slot'):null;
 const target=found&&!found.disabled?found:null;
 if(activeDropSlot){activeDropSlot.classList.remove('drop-target');activeDropSlot.closest('.event')?.classList.remove('drag-over')}
 activeDropSlot=null;
 drag.card.classList.remove('dragging');drag.ghost?.remove();activeDrag=null;
 if(drag.dragging){suppressClickUntil=Date.now()+500;event.preventDefault();if(target&&!target.disabled){matchPersonToEvent(target.dataset.event,drag.id)}else{$('feedback').className='feedback show ng';$('feedback').textContent='人物カードを出来事の枠までドラッグして、そこで指をはなしてね。'}}
}
function cancelDrag(event){
 if(!activeDrag||(event&&event.pointerId!==activeDrag.pointerId))return;
 document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointerup',endDrag);
 if(activeDropSlot){activeDropSlot.classList.remove('drop-target');activeDropSlot.closest('.event')?.classList.remove('drag-over')}
 activeDropSlot=null;activeDrag.card.classList.remove('dragging');activeDrag.ghost?.remove();activeDrag=null;
}
function updateProgress(){$('progress').textContent=solved+' / '+round.length+' 問';$('score').textContent='正解 '+score}
$('restart').addEventListener('click',newRound);$('next').addEventListener('click',newRound);newRound();
})();
</script>
</body>
</html>

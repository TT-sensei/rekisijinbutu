<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe2">
<title>れきしクロノ｜歴史の順番にチャレンジ</title>
<script src="../people.js"></script>
<script src="./dates.js"></script>
<style>
:root{--paper:#f7f1e5;--ink:#302b25;--muted:#746b5d;--red:#8c3b2f;--gold:#b18b39;--green:#426b58;--line:#d8c9aa;--card:#fffdf7}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN",system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:14px max(16px,calc((100vw - 850px)/2));border-bottom:1px solid var(--line);background:#fbf7ee}
header .brand{font-size:.85rem;color:var(--muted);flex:1;text-align:right}
.wrap{width:min(100% - 28px,760px);margin:0 auto;padding:28px 0 48px}.kicker{font-size:.75rem;letter-spacing:.12em;color:var(--green);font-weight:900}
h1{font-family:serif;font-size:clamp(2rem,7vw,3rem);margin:7px 0;color:var(--red)}.intro{line-height:1.8;color:var(--muted);margin:0 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 18px #59472b0d}.mode-panel{margin-bottom:16px}.mode-title{font-weight:900;margin:0 0 10px}.mode-help{font-size:.82rem;color:var(--muted);line-height:1.6;margin:0 0 12px}.mode-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mode-btn{min-height:44px;padding:9px 7px;border:1px solid var(--line);border-radius:10px;background:#fffaf0;color:var(--ink);font:inherit;font-weight:800;cursor:pointer}.mode-btn.active{background:var(--green);border-color:var(--green);color:#fff}.mode-btn.random{grid-column:1/-1;background:#f3e5c9}.mode-btn.random.active{background:var(--red);border-color:var(--red);color:#fff}@media(max-width:480px){.mode-list{grid-template-columns:repeat(2,minmax(0,1fr))}.mode-btn.random{grid-column:1/-1}}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.count{font-weight:900;color:var(--green)}.help{font-size:.82rem;line-height:1.6;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.person{display:grid;grid-template-columns:30px 56px minmax(0,1fr) auto;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:84px}.person.dragging{opacity:.45;border:2px dashed var(--green)}.drag-handle{width:30px;height:44px;border:0;background:transparent;color:var(--muted);font-size:1.35rem;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center}.drag-handle:active{cursor:grabbing}.drag-handle:disabled{opacity:.3;cursor:default}
.person img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#eee4cf}.person-name{font-weight:900;font-size:1.03rem}.person-hint{font-size:.78rem;line-height:1.5;color:var(--muted);margin-top:3px}
.move{display:flex;flex-direction:column;gap:5px}.move button{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;background:#f8f1e3;font-size:1rem;cursor:pointer}.move button:disabled{opacity:.25}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:900;cursor:pointer;min-height:48px}.primary{background:var(--red);color:white;flex:1}.secondary{background:#eee3cc;color:var(--ink)}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:10px;line-height:1.8;font-weight:800}.feedback.show{display:block}.feedback.ok{background:#e4f0e6;color:#28583f;border:1px solid #9cbca5}.feedback.ng{background:#fff0e8;color:#873e2d;border:1px solid #d8a18d}.next{display:none;width:100%;margin-top:10px;background:var(--green);color:#fff}.next.show{display:block}
@media(max-width:480px){.wrap{padding-top:20px}.panel{padding:12px}.person{grid-template-columns:24px 46px minmax(0,1fr) auto;gap:7px;padding:8px}.person img{width:46px;height:46px}.drag-handle{width:24px;font-size:1.15rem}.person-name{font-size:.95rem}.person-hint{font-size:.73rem}.move button{width:34px}}
</style>
</head>
<body>
<header><strong>れきしクロノ</strong><div class="brand">歴史の順番にチャレンジ</div></header>
<main class="wrap">
<div class="kicker">REKISHI CHRONO</div><h1>れきしクロノ</h1>
<p class="intro">人物カードを、古い年代から新しい年代へ並べよう！ 名前とイラスト、「したこと」のヒントが手がかり。答え合わせでは、年代と出来事も確認できるよ。</p>
<section class="panel mode-panel" aria-label="遊び方を選ぶ"><p class="mode-title">遊び方をえらぼう</p><p class="mode-help">同じ時代の人物で練習することも、時代をこえてチャレンジすることもできるよ。</p><div class="mode-list" id="modeList"></div></section>
<section class="panel">
<div class="topline"><strong id="gameTitle">古い時代 → 新しい時代</strong><span class="count" id="round">第1回</span></div>
<p class="help">カード左の ⠿ をつかんでドラッグするか、右の ↑ ↓ ボタンで順番を変えられます。人物に関連する代表的な出来事の年代をもとに判定します。同じ年の人物は、どちらが先でも正解です。</p>
<div class="cards" id="cards" aria-live="polite"></div>
<div class="actions"><button class="btn primary" id="check">順番をチェック</button><button class="btn secondary" id="reset">並べ直す</button></div>
<div class="feedback" id="feedback" role="status"></div><button class="btn next" id="next">つぎの問題へ →</button>
</section></main>
<script>
let roundNo=1,answerOrder=[],cards=[],checked=false,draggedId=null,selectedEra="完全ランダム";
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){
 checked=false;$('feedback').className='feedback';$('feedback').textContent='';$('next').classList.remove('show');$('check').disabled=false;
 const all=PEOPLE.filter(p=>HISTORY_DATES[p.id]&&Number.isFinite(HISTORY_DATES[p.id].year));
 const pool=selectedEra==="完全ランダム"?all:all.filter(p=>p.era===selectedEra);
 const questionCount=Math.min(5,pool.length);
 answerOrder=shuffle([...pool]).slice(0,questionCount).sort((a,b)=>HISTORY_DATES[a.id].year-HISTORY_DATES[b.id].year);
 cards=shuffle([...answerOrder]);$('round').textContent='第'+roundNo+'回';$('gameTitle').textContent=(selectedEra==="完全ランダム"?"完全ランダム":selectedEra+"の人物")+"｜古い年代 → 新しい年代";render();
}
function render(){
 const root=$('cards');root.innerHTML='';
 cards.forEach((p,i)=>{
  const el=document.createElement('article');el.className='person';el.dataset.personId=String(p.id);
  const handle=document.createElement('button');handle.type='button';handle.className='drag-handle';handle.textContent='⠿';handle.setAttribute('aria-label',p.name+'をドラッグして移動');handle.disabled=checked;
  handle.addEventListener('pointerdown',e=>{if(checked)return;draggedId=String(p.id);el.classList.add('dragging');try{handle.setPointerCapture(e.pointerId)}catch(_){}});
  handle.addEventListener('pointerup',e=>{if(draggedId===null)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.person');const from=cards.findIndex(x=>String(x.id)===draggedId);const to=target?cards.findIndex(x=>String(x.id)===target.dataset.personId):-1;if(from>=0&&to>=0&&from!==to){const [picked]=cards.splice(from,1);cards.splice(to,0,picked)}draggedId=null;render()});
  handle.addEventListener('pointercancel',()=>{draggedId=null;render()});
  const img=document.createElement('img');img.src='../assets/people/'+p.icon+'.png';img.alt=p.name+'のイラスト';img.loading='lazy';img.onerror=()=>{img.style.display='none'};
  const info=document.createElement('div');const name=document.createElement('div');name.className='person-name';name.textContent=p.name;
  const hint=document.createElement('div');hint.className='person-hint';hint.textContent=p.hint;info.append(name,hint);
  const controls=document.createElement('div');controls.className='move';
  const up=document.createElement('button');up.textContent='↑';up.setAttribute('aria-label',p.name+'を上へ');up.disabled=i===0||checked;up.onclick=()=>move(i,-1);
  const down=document.createElement('button');down.textContent='↓';down.setAttribute('aria-label',p.name+'を下へ');down.disabled=i===cards.length-1||checked;down.onclick=()=>move(i,1);
  controls.append(up,down);el.append(handle,img,info,controls);root.append(el);
 });
}
function move(i,d){if(checked)return;[cards[i],cards[i+d]]=[cards[i+d],cards[i]];render()}
function check(){
 if(checked)return;checked=true;render();$('check').disabled=true;
 const correct=cards.every((p,i)=>i===0||HISTORY_DATES[cards[i-1].id].year<=HISTORY_DATES[p.id].year);const fb=$('feedback');fb.className='feedback show '+(correct?'ok':'ng');
 const detail=answerOrder.map((p,i)=>(i+1)+'. '+p.name+'（'+HISTORY_DATES[p.id].date+'：'+HISTORY_DATES[p.id].event+'）').join(' → ');
 fb.textContent=(correct?'正解！ 年代の流れをつかめたね。':'おしい！ 正しい年代順はこちら：')+' '+detail;
 $('next').classList.add('show');
}
$('check').onclick=check;
$('reset').onclick=()=>{checked=false;cards=shuffle([...answerOrder]);$('feedback').className='feedback';$('next').classList.remove('show');$('check').disabled=false;render()};
$('next').onclick=()=>{roundNo++;newRound()};
function buildModes(){
 const root=$('modeList');root.innerHTML='';
 const eras=[...new Set(PEOPLE.map(p=>p.era))];
 const modes=[...eras,'完全ランダム'];
 modes.forEach(era=>{const b=document.createElement('button');b.type='button';b.className='mode-btn'+(era==='完全ランダム'?' random':'')+(era===selectedEra?' active':'');b.textContent=era==='完全ランダム'?'🌏 完全ランダム':era;b.setAttribute('aria-pressed',String(era===selectedEra));b.onclick=()=>{selectedEra=era;roundNo=1;buildModes();newRound()};root.append(b)});
}
if(typeof PEOPLE==='undefined'||!Array.isArray(PEOPLE)||typeof HISTORY_DATES==='undefined'){$('cards').textContent='人物データを読み込めませんでした。';$('check').disabled=true}else{buildModes();newRound()}
</script>
</body></html>

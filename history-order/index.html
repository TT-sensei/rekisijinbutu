<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe2">
<title>歴史ならべ｜日本の歴史カードゲーム</title>
<script src="../people.js"></script>
<script src="./dates.js"></script>
<style>
:root{--paper:#f7f1e5;--ink:#302b25;--muted:#746b5d;--red:#8c3b2f;--gold:#b18b39;--green:#426b58;--line:#d8c9aa;--card:#fffdf7}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN",system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:14px max(16px,calc((100vw - 850px)/2));border-bottom:1px solid var(--line);background:#fbf7ee}
header .brand{font-size:.85rem;color:var(--muted);flex:1;text-align:right}
.wrap{width:min(100% - 28px,760px);margin:0 auto;padding:28px 0 48px}.kicker{font-size:.75rem;letter-spacing:.12em;color:var(--green);font-weight:900}
h1{font-family:serif;font-size:clamp(2rem,7vw,3rem);margin:7px 0;color:var(--red)}.intro{line-height:1.8;color:var(--muted);margin:0 0 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 18px #59472b0d}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.count{font-weight:900;color:var(--green)}.help{font-size:.82rem;line-height:1.6;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.person{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:84px}
.person img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#eee4cf}.person-name{font-weight:900;font-size:1.03rem}.person-hint{font-size:.78rem;line-height:1.5;color:var(--muted);margin-top:3px}
.move{display:flex;flex-direction:column;gap:5px}.move button{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;background:#f8f1e3;font-size:1rem;cursor:pointer}.move button:disabled{opacity:.25}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:900;cursor:pointer;min-height:48px}.primary{background:var(--red);color:white;flex:1}.secondary{background:#eee3cc;color:var(--ink)}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:10px;line-height:1.8;font-weight:800}.feedback.show{display:block}.feedback.ok{background:#e4f0e6;color:#28583f;border:1px solid #9cbca5}.feedback.ng{background:#fff0e8;color:#873e2d;border:1px solid #d8a18d}.next{display:none;width:100%;margin-top:10px;background:var(--green);color:#fff}.next.show{display:block}
@media(max-width:480px){.wrap{padding-top:20px}.panel{padding:12px}.person{grid-template-columns:46px minmax(0,1fr) auto;gap:9px;padding:8px}.person img{width:46px;height:46px}.person-name{font-size:.95rem}.person-hint{font-size:.73rem}.move button{width:34px}}
</style>
</head>
<body>
<header><strong>歴史ならべ</strong><div class="brand">日本の歴史カードゲーム</div></header>
<main class="wrap">
<div class="kicker">HISTORY ORDER CHALLENGE</div><h1>歴史ならべ</h1>
<p class="intro">人物カードを、古い年代から新しい年代へ並べよう。名前とイラスト、「したこと」のヒントが手がかり。答え合わせでは、年代と出来事も確認できるよ。</p>
<section class="panel">
<div class="topline"><strong>古い時代 → 新しい時代</strong><span class="count" id="round">第1回</span></div>
<p class="help">右の ↑ ↓ ボタンでカードを動かせます。人物に関連する代表的な出来事の年代をもとに判定します。同じ年の人物は、どちらが先でも正解です。</p>
<div class="cards" id="cards" aria-live="polite"></div>
<div class="actions"><button class="btn primary" id="check">順番をチェック</button><button class="btn secondary" id="reset">並べ直す</button></div>
<div class="feedback" id="feedback" role="status"></div><button class="btn next" id="next">つぎの問題へ →</button>
</section></main>
<script>
let roundNo=1,answerOrder=[],cards=[],checked=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){
 checked=false;$('feedback').className='feedback';$('feedback').textContent='';$('next').classList.remove('show');$('check').disabled=false;
 const pool=PEOPLE.filter(p=>HISTORY_DATES[p.id]&&Number.isFinite(HISTORY_DATES[p.id].year));
 answerOrder=shuffle([...pool]).slice(0,5).sort((a,b)=>HISTORY_DATES[a.id].year-HISTORY_DATES[b.id].year);
 cards=shuffle([...answerOrder]);$('round').textContent='第'+roundNo+'回';render();
}
function render(){
 const root=$('cards');root.innerHTML='';
 cards.forEach((p,i)=>{
  const el=document.createElement('article');el.className='person';
  const img=document.createElement('img');img.src='../assets/people/'+p.icon+'.png';img.alt=p.name+'のイラスト';img.loading='lazy';img.onerror=()=>{img.style.display='none'};
  const info=document.createElement('div');const name=document.createElement('div');name.className='person-name';name.textContent=p.name;
  const hint=document.createElement('div');hint.className='person-hint';hint.textContent=p.hint;info.append(name,hint);
  const controls=document.createElement('div');controls.className='move';
  const up=document.createElement('button');up.textContent='↑';up.setAttribute('aria-label',p.name+'を上へ');up.disabled=i===0||checked;up.onclick=()=>move(i,-1);
  const down=document.createElement('button');down.textContent='↓';down.setAttribute('aria-label',p.name+'を下へ');down.disabled=i===cards.length-1||checked;down.onclick=()=>move(i,1);
  controls.append(up,down);el.append(img,info,controls);root.append(el);
 });
}
function move(i,d){if(checked)return;[cards[i],cards[i+d]]=[cards[i+d],cards[i]];render()}
function check(){
 if(checked)return;checked=true;render();$('check').disabled=true;
 const correct=cards.every((p,i)=>i===0||HISTORY_DATES[cards[i-1].id].year<=HISTORY_DATES[p.id].year);const fb=$('feedback');fb.className='feedback show '+(correct?'ok':'ng');
 const detail=answerOrder.map((p,i)=>(i+1)+'. '+p.name+'（'+HISTORY_DATES[p.id].date+'：'+HISTORY_DATES[p.id].event+'）').join(' → ');
 fb.textContent=(correct?'正解！ 年代の流れをつかめたね。':'おしい！ 正しい年代順はこちら：')+' '+detail;
 $('next').classList.add('show');
}
$('check').onclick=check;
$('reset').onclick=()=>{checked=false;cards=shuffle([...answerOrder]);$('feedback').className='feedback';$('next').classList.remove('show');$('check').disabled=false;render()};
$('next').onclick=()=>{roundNo++;newRound()};
if(typeof PEOPLE==='undefined'||!Array.isArray(PEOPLE)||typeof HISTORY_DATES==='undefined'){$('cards').textContent='人物データを読み込めませんでした。';$('check').disabled=true}else{newRound()}
</script>
</body></html>
